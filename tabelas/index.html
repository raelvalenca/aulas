    <title>Tabelas</title>
    <style>
        table,
        td {
            border: 1px solid  #f40e0e;
            border-collapse: collapse
        }

</head>

        <tr>
<td>Arroz</td>
<td>R$29,99</td>
        </tr>
    </table>
</body>
</html>
